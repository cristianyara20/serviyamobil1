name: Build

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      # actions/checkout anclado a SHA exacto (equivale a v4.3.1) — regla S6888
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Cache SonarQube packages
        # actions/cache anclado a SHA exacto (equivale a v4.3.0) — regla S6888
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Set up Flutter
        # subosito/flutter-action anclado a SHA exacto (equivale a v2) — regla S6888
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.x'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: SonarQube Scan
        # SonarSource/sonarqube-scan-action anclado a SHA exacto (equivale a v8.4.0) — regla S6888
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=cristianyara20_serviyamobil1
            -Dsonar.organization=cristianyara20
            -Dsonar.sources=.
